plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
    id("com.dorongold.task-tree") version "4.0.1"
    id "com.peterabeles.gversion" version "1.10"
    id "eclipse"
    id "de.undercouch.download" version "5.7.0"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    generate {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false // Change to true to delete files on roboRIO that no
                                           // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.
wpi.java.debugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    if(System.getenv("GITHUB_ACTOR") == null || System.getenv("GITHUB_ACTOR").equals("")) {
        maven { url 'https://maven-clone.frc5572.org/' }
    }
}
task(replayWatch, type: JavaExec) {
    mainClass = "org.littletonrobotics.junction.ReplayWatch"
    classpath = sourceSets.main.runtimeClasspath
}
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    annotationProcessor 'com.github.Frc5572:RobotTools:v2.2'
    implementation 'org.jspecify:jspecify:1.0.0'

    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpmime:4.5.14'

    implementation 'com.github.jdiemke.delaunay-triangulator:DelaunayTriangulator:1.0.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"

    generateImplementation "com.squareup:javapoet:1.13.0"
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation().defaultEnabled = false

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

javadoc {
    configure(options) {
        options.addBooleanOption("-allow-script-in-comments",true)
        options.addStringOption("link", "https://github.wpilib.org/allwpilib/docs/release/java/")
        options.header = "<script type=\"text/javascript\" async" +
            "  src=\"https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML\">" +
            "</script>"
    }
}

// Add '/' at beginning of next line to enable output for each class compiling. Required to run `compile_times.py`.
/*
compileJava {
    options.verbose = true
}
//*/

// Create version file
project.compileJava.dependsOn(createVersionFile)
gversion {
    srcDir       = "src/main/java/"
    classPackage = "frc.robot"
    className    = "BuildConstants"
    dateFormat   = "yyyy-MM-dd HH:mm:ss z"
    timeZone     = "America/Chicago"
    indent       = "  "
}
// Create commit with working changes on event branches
task(eventDeploy) {
    doLast {
        if (project.gradle.startParameter.taskNames.any({ it.toLowerCase().contains("deploy") })) {
            def branchPrefix = "event"
            def branch = 'git branch --show-current'.execute().text.trim()
            def commitMessage = "Update at event (${new Date().toString()})"

            if (branch.startsWith(branchPrefix)) {
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'add', '-A'
                }
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'commit', '-m', commitMessage
                    ignoreExitValue = true
                }

                println "Committed to branch: '$branch'"
                println "Commit message: '$commitMessage'"
            } else {
                println "Not on an event branch, skipping commit!"
            }
        } else {
            println "Not running deploy task, skipping commit"
        }
    }
}
createVersionFile.dependsOn(eventDeploy)

// Pull live-tuned configuration off the robot before a deploy, so whatever was tuned in the pit
// ends up in git rather than being overwritten by the checked-in copy.
//
// The robot serves its writable config directory (on the USB stick, since the deploy directory is
// read-only to lvuser) over HTTP on ConfigStore.WEB_PORT. Fetching over HTTP rather than SSH keeps
// this working identically on every platform with no extra tooling.
//
// WebServer offers no directory index, so the robot publishes manifest.json listing its documents;
// this task reads that first and then fetches each file it names.
project.ext.configPort = 5801
project.ext.configDir = file('src/main/deploy/controls')
project.ext.configManifest = 'manifest.json'

task(pullConfigs) {
    group = 'Execution'
    description = 'Fetch live-tuned configuration from the roboRIO into src/main/deploy'
    doLast {
        if (!project.gradle.startParameter.taskNames.any({ it.toLowerCase().contains("deploy") })) {
            println "Not running deploy task, skipping config pull"
            return
        }

        def team = project.frc.getTeamNumber()
        // -PconfigHost=<host> targets a specific host, for testing against a simulator. It is not
        // in the default list on purpose: silently pulling from a stray local sim when the robot
        // is simply switched off would put simulated values into a real deploy.
        def hosts = project.hasProperty('configHost') ? [project.property('configHost')]
            : ["roborio-${team}-frc.local",
               "10.${(team / 100) as int}.${team % 100}.2",
               "172.22.11.2"]

        def fetch = { host, name ->
            def conn = new URL("http://${host}:${configPort}/${name}").openConnection()
            conn.connectTimeout = 2000
            conn.readTimeout = 3000
            return conn.inputStream.getText('UTF-8')
        }

        def usedHost = null
        def manifest = null
        for (host in hosts) {
            try {
                manifest = fetch(host, configManifest)
                usedHost = host
                break
            } catch (Exception e) {
                logger.info("config pull: ${host} unreachable (${e.message})")
            }
        }

        def branch = 'git branch --show-current'.execute().text.trim()
        def onEventBranch = branch.startsWith('event')

        if (manifest == null) {
            def msg = "Could not reach the roboRIO on port ${configPort} (tried ${hosts.join(', ')})."
            if (onEventBranch) {
                // At an event, committing stale configuration is the dangerous failure, so stop.
                throw new GradleException("${msg}\nRefusing to deploy from event branch " +
                    "'${branch}' without confirming the robot's live configuration. " +
                    "Power on the robot, or run with -PskipConfigPull to override.")
            }
            println "WARNING: ${msg} Keeping the checked-in configuration."
            return
        }

        def names
        try {
            names = new groovy.json.JsonSlurper().parseText(manifest).files
        } catch (Exception e) {
            throw new GradleException("Manifest from ${usedHost} is not valid JSON: ${e.message}")
        }
        if (!names) {
            println "Robot reported no configuration documents; nothing to pull."
            return
        }

        def updated = 0
        names.each { name ->
            // Only ever write plain file names into the source tree.
            if (!(name ==~ /[A-Za-z0-9_.-]+/) || name.startsWith('.')) {
                throw new GradleException("Refusing to pull suspicious config name '${name}'")
            }
            def body
            try {
                body = fetch(usedHost, name)
            } catch (FileNotFoundException e) {
                // Listed but not present: nothing has been saved for it yet.
                println "Robot has no ${name} yet; leaving the checked-in copy alone."
                return
            }
            try {
                new groovy.json.JsonSlurper().parseText(body)
            } catch (Exception e) {
                throw new GradleException("${name} from ${usedHost} is not valid JSON: ${e.message}")
            }
            def target = new File(configDir, name)
            if (!target.exists() || target.getText('UTF-8') != body) {
                target.parentFile.mkdirs()
                target.write(body, 'UTF-8')
                println "Pulled ${name} from ${usedHost}"
                updated++
            }
        }
        println updated == 0 ? "Configuration already up to date with ${usedHost}" :
            "Pulled ${updated} config file(s) from ${usedHost}"
    }
    onlyIf {
        !project.hasProperty('skipConfigPull')
    }
}

// Ordering matters: pullConfigs must land before eventDeploy's "git add -A", so that anything
// tuned in the pit is part of the event commit.
eventDeploy.dependsOn(pullConfigs)

tasks.register('generateLUTs', JavaExec) {
    group = 'Execution'
    description = 'Generate LUTs'
    classpath = sourceSets.generate.runtimeClasspath
    mainClass = 'frc.gen.GenerateLUTs'
    systemProperty("java.library.path", layout.buildDir.dir("jni/release").get())
}

project.ext.rioctlVersion = "1.0.4"

task downloadRioctl(type: Download) {
    src "https://github.com/Frc5572/rioctl/releases/download/v${rioctlVersion}/rioctl_${rioctlVersion}_windows_amd64.exe"
    dest "build"
    onlyIf {
        !new File("build/rioctl_${rioctlVersion}_windows_amd64.exe").exists()
    }
}

task downloadLogs(type: Exec) {
    commandLine 'cmd', '/c', 'start', 'powershell', '-NoExit', layout.buildDirectory.file("rioctl_${rioctlVersion}_windows_amd64.exe").get(), 'logs', 'pull', '--team', '5572'
}

downloadLogs.dependsOn(downloadRioctl)
