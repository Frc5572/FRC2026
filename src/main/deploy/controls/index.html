<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Controls</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --edge: #2c313a;
    --text: #e7eaf0; --muted: #98a1b0; --accent: #4da3ff;
    --ok: #36c48b; --warn: #e8b64c; --bad: #e8604c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 19px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 14px; position: sticky; top: 8px; z-index: 5;
  }
  select, button, input[type=text] {
    background: #272c35; color: var(--text); border: 1px solid var(--edge);
    border-radius: 7px; padding: 8px 12px; font: inherit; font-size: 14px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #07111d; font-weight: 600; }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  .spacer { flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.on { background: var(--ok); }
  .group { margin-bottom: 18px; }
  .group > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin: 0 0 8px; font-weight: 600;
  }
  .row {
    display: grid; grid-template-columns: minmax(150px, 1.1fr) 3fr 92px;
    gap: 12px; align-items: center;
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 9px; padding: 9px 12px; margin-bottom: 6px;
  }
  .row label { font-size: 14px; }
  .row .hint { display: block; color: var(--muted); font-size: 11.5px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .val {
    text-align: right; font-variant-numeric: tabular-nums;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px;
  }
  .val.changed { color: var(--warn); }
  .row.off input[type=range] { opacity: .3; }
  .row.off .val { opacity: .3; }
  .toggle {
    position: relative; width: 38px; height: 21px; flex: none; cursor: pointer;
    background: #3a414d; border-radius: 11px; border: 1px solid var(--edge);
    transition: background .12s;
  }
  .toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px;
    border-radius: 50%; background: #9aa3b2; transition: transform .12s, background .12s;
  }
  .toggle.on { background: var(--accent); border-color: var(--accent); }
  .toggle.on::after { transform: translateX(17px); background: #07111d; }
  .row label .lbl { display: flex; align-items: center; gap: 8px; }
  .scheme {
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 9px; padding: 12px; margin-bottom: 6px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .scheme .opt {
    flex: 1 1 200px; text-align: left; padding: 9px 12px; border-radius: 7px;
    background: #272c35; border: 1px solid var(--edge); color: var(--text); cursor: pointer;
  }
  .scheme .opt .sum { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .scheme .opt.active { background: var(--accent); border-color: var(--accent); color: #07111d; }
  .scheme .opt.active .sum { color: #0c2136; }
  .curve {
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 9px; padding: 12px; margin-bottom: 6px;
  }
  .curve .head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .curve .head .title { font-size: 14px; }
  .curve .head .spacer { flex: 1; }
  .curve .preset {
    padding: 5px 11px; font-size: 13px; border-radius: 6px;
    background: #272c35; border: 1px solid var(--edge); color: var(--muted); cursor: pointer;
  }
  .curve .preset.active {
    background: var(--accent); border-color: var(--accent); color: #07111d; font-weight: 600;
  }
  .plot { width: 100%; max-width: 320px; aspect-ratio: 1; display: block; margin: 0 auto;
          touch-action: none; cursor: crosshair; }
  .plot .frame { fill: #12141a; stroke: var(--edge); stroke-width: .6; }
  .plot .grid { stroke: #262b34; stroke-width: .4; }
  .plot .dead { fill: #2a2f39; opacity: .55; }
  .plot .ref  { stroke: #3a414d; stroke-width: .6; stroke-dasharray: 2 2; fill: none; }
  .plot .line { stroke: var(--accent); stroke-width: 1.8; fill: none;
                stroke-linejoin: round; stroke-linecap: round; }
  .plot .knot { fill: var(--panel); stroke: var(--accent); stroke-width: 1.4; cursor: grab; }
  .plot .knot.pinned { stroke: #5c6675; cursor: not-allowed; }
  .plot .knot.drag { fill: var(--accent); cursor: grabbing; }
  .curve .tip { color: var(--muted); font-size: 11.5px; text-align: center; margin-top: 8px; }
  #status { color: var(--muted); font-size: 13px; min-height: 18px; }
  #path { color: #6b7483; font-size: 11.5px; font-family: ui-monospace, monospace; }
  @media (max-width: 620px) {
    .row { grid-template-columns: 1fr 64px; }
    .row input[type=range] { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<h1>Driver Controls</h1>
<div class="sub">Changes apply live. <strong>Save</strong> writes them to the robot so
  <code>./gradlew pullControls</code> can bring them back into git.</div>

<div class="bar">
  <span class="dot" id="conn" title="NetworkTables connection"></span>
  <select id="profile" title="Active profile"></select>
  <button id="create">New…</button>
  <button id="delete" class="danger">Delete</button>
  <span class="spacer"></span>
  <button id="revert">Revert</button>
  <button id="save" class="primary">Save</button>
</div>

<div id="groups"></div>
<div id="status">Connecting…</div>
<div id="path"></div>

<script type="module">
import { NT4_Client } from "/scripts/NT4.js";

// Presentation only. Any field the robot publishes that is not listed here still appears,
// under "Other" — so adding a ControlsField needs no change to this page.
const GROUPS = [
  ["Translation", [
    ["translationDeadband",   "Deadband",        "Stick travel ignored around centre"],
    ["translationExponent",   "Preset exponent", "Used by the Linear / Squared presets"],
    ["translationSaturation", "Saturation",      "Stick travel that reaches full speed"],
    ["translationMaxSpeed",   "Max speed",       "m/s"],
    ["releaseTimeConstant",   "Coast on release","Seconds to coast down · 0 stops instantly"],
  ]],
  ["Rotation", [
    ["rotationDeadband", "Deadband",       "Stick travel ignored around centre"],
    ["rotationExponent", "Preset exponent", "Used by the Linear / Squared presets"],
    ["rotationMaxSpeed", "Max speed",      "rad/s"],
  ]],
  ["While shooting", [
    ["shootTranslationMaxSpeed", "Max speed",    "m/s while the trigger is held"],
    ["shootRotationMaxSpeed",    "Max rotation", "rad/s while the trigger is held"],
  ]],
  ["Acceleration limits", [
    ["forwardAccelLimit", "Forward accel", "m/s² · lower is gentler off the line"],
    ["skidLimit",         "Skid limit",    "m/s²"],
    ["forwardTiltLimit",  "Tilt forward",  "m/s²"],
    ["backTiltLimit",     "Tilt back",     "m/s²"],
    ["leftTiltLimit",     "Tilt left",     "m/s²"],
    ["rightTiltLimit",    "Tilt right",    "m/s²"],
  ]],
];

// The robot owns VALUES and CURVES; the page only reads them. The page owns the SET_* topics
// and the robot only reads those. See ControlsReal's javadoc for why the directions are split.
const VALUES   = "/Controls/values/";
const ENABLED  = "/Controls/enabled/";
const SET_SCHEME = "/Controls/set/scheme";
const SET_EN   = "/Controls/set/enabled/";
const META     = "/Controls/meta/";
const SET_VALS = "/Controls/set/values/";
const CURVES   = "/Controls/curves/";
const SET_CURVES = "/Controls/set/curves/";

const fields = new Map();   // key -> {min,max,def,value,row,slider,out,dragging}
let profiles = [], active = "", dirty = false, built = false;

const $ = (id) => document.getElementById(id);
const setStatus = (t) => { $("status").textContent = t; };

// Publish lazily: a field discovered after onConnect would otherwise never have its topic
// published, and addSample throws on an unpublished topic.
function writeValue(key, v) {
  client.publishTopic(SET_VALS + key, "double");
  client.addSample(SET_VALS + key, v);
}

function writeEnabled(key, on) {
  client.publishTopic(SET_EN + key, "boolean");
  client.addSample(SET_EN + key, on);
}

function step(min, max) {
  const span = max - min;
  if (span <= 2) return 0.01;
  if (span <= 20) return 0.05;
  return 1;
}

// Every piece of metadata the robot publishes for a field. The UI must have all of it before
// it can lay a row out: the slider range comes from min/max, and whether a row gets an on/off
// switch comes from canDisable. These arrive as separate NetworkTables messages, so a field is
// not ready just because it exists.
const META_KEYS = ["default", "min", "max", "canDisable"];

function ensureField(key) {
  let f = fields.get(key);
  if (!f) {
    f = { min: 0, max: 1, def: 0, value: 0, dragging: false,
          canDisable: false, enabled: true, meta: new Set() };
    fields.set(key, f);
  }
  return f;
}

function fieldReady(key) {
  const f = fields.get(key);
  return !!f && META_KEYS.every((m) => f.meta.has(m));
}

// Build the UI once every field has its metadata, so sliders get correct ranges immediately.
function build() {
  if (built) return;
  // Wait for complete metadata, not merely for the field to exist. A field entry is created by
  // whichever message arrives first, so building on existence alone can lay out a row before its
  // canDisable has landed -- and since the toggle is only created here, that row would silently
  // never get its switch. The last field the robot publishes is the one that loses this race.
  for (const [, rows] of GROUPS) {
    for (const [key] of rows) if (!fieldReady(key)) return;
  }
  built = true;
  const container = $("groups");
  const schemeSection = document.createElement("div");
  schemeSection.className = "group";
  schemeSection.innerHTML = `<h2>Control scheme</h2>`;
  schemeSection.appendChild(schemePicker.root);
  container.appendChild(schemeSection);
  const placed = new Set();
  const sections = GROUPS.map(([title, rows]) => [title, rows.slice()]);
  const others = [...fields.keys()].filter(
    (k) => !GROUPS.some(([, rows]) => rows.some(([rk]) => rk === k)));
  if (others.length) sections.push(["Other", others.map((k) => [k, k, ""])]);

  for (const [title, rows] of sections) {
    const sec = document.createElement("div");
    sec.className = "group";
    sec.innerHTML = `<h2>${title}</h2>`;
    for (const [key, label, hint] of rows) {
      if (!fields.has(key) || placed.has(key)) continue;
      placed.add(key);
      const f = fields.get(key);
      const row = document.createElement("div");
      row.className = "row";
      if (key === "translationDeadband" || key === "rotationDeadband") {
        const which = key.startsWith("translation") ? "translation" : "rotation";
        sec.appendChild(editors[which].root);
      }
      row.innerHTML =
        `<label for="s-${key}"><span class="lbl">` +
        (f.canDisable ? `<span class="toggle" id="t-${key}"></span>` : ``) +
        `<span>${label}</span></span><span class="hint">${hint}</span></label>` +
        `<input type="range" id="s-${key}">` +
        `<div class="val" id="v-${key}"></div>`;
      sec.appendChild(row);
      const slider = row.querySelector("input");
      slider.min = f.min; slider.max = f.max; slider.step = step(f.min, f.max);
      slider.value = f.value;
      slider.addEventListener("input", () => {
        f.dragging = true;
        const v = parseFloat(slider.value);
        f.value = v;
        render(key);
        writeValue(key, v);
        for (const ed of Object.values(editors)) ed.draw();
      });
      const release = () => { f.dragging = false; };
      slider.addEventListener("change", release);
      slider.addEventListener("pointerup", release);
      slider.addEventListener("blur", release);
      f.slider = slider;
      f.out = row.querySelector(".val");
      f.row = row;
      if (f.canDisable) {
        f.toggle = row.querySelector(".toggle");
        f.toggle.addEventListener("click", () => writeEnabled(key, !f.enabled));
      }
      render(key);
    }
    if (sec.children.length > 1) container.appendChild(sec);
  }
}

function render(key) {
  const f = fields.get(key);
  if (!f || !f.out) return;
  const span = f.max - f.min;
  f.out.textContent = f.value.toFixed(span <= 2 ? 2 : span <= 20 ? 2 : 0);
  f.out.classList.toggle("changed", Math.abs(f.value - f.def) > 1e-9);
  if (f.canDisable) {
    if (f.toggle) f.toggle.classList.toggle("on", f.enabled);
    if (f.row) f.row.classList.toggle("off", !f.enabled);
    if (f.slider) f.slider.disabled = !f.enabled;
  }
}

function renderProfiles() {
  const sel = $("profile");
  sel.innerHTML = "";
  for (const name of profiles) {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name + (name === active && dirty ? " (unsaved)" : "");
    if (name === active) opt.selected = true;
    sel.appendChild(opt);
  }
  $("delete").disabled = profiles.length <= 1;
}

// ---------------------------------------------------------------------------
// Response curves
//
// This is a direct port of ControlsCurve.java. The two must agree: if the shape drawn here did
// not match what the robot evaluates, the editor would be actively misleading. Monotone cubic
// Hermite (Fritsch-Carlson) is used so a curve can never dip or run backwards.
// ---------------------------------------------------------------------------
const MIN_SPACING = 1e-3;
const MAX_KNOTS = 10;
const DEFAULT_KNOTS = [0, 0, 1, 1];

function sanitizeKnots(flat) {
  if (!flat || flat.length < 4 || flat.length % 2 !== 0) return DEFAULT_KNOTS.slice();
  const pts = [];
  for (let i = 0; i < flat.length / 2; i++) {
    const x = flat[2 * i], y = flat[2 * i + 1];
    if (!Number.isFinite(x) || !Number.isFinite(y)) return DEFAULT_KNOTS.slice();
    pts.push([Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))]);
  }
  pts.sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const pt of pts) {
    if (out.length && pt[0] - out[out.length - 2] < MIN_SPACING) continue;
    if (out.length / 2 >= MAX_KNOTS) break;
    out.push(pt[0], pt[1]);
  }
  if (out.length < 4) return DEFAULT_KNOTS.slice();
  out[0] = 0; out[1] = 0;
  out[out.length - 2] = 1; out[out.length - 1] = 1;
  return out;
}

function pchip(k, x) {
  const n = k.length / 2;
  if (n < 2) return x;
  let i = 0;
  for (let j = 0; j < n - 1; j++) { i = j; if (x >= k[2 * j] && x <= k[2 * j + 2]) break; }
  const x0 = k[2 * i], y0 = k[2 * i + 1], x1 = k[2 * i + 2], y1 = k[2 * i + 3];
  const h = x1 - x0;
  if (h <= 0) return y1;
  const sec = (j) => {
    const hh = k[2 * j + 2] - k[2 * j];
    return hh <= 0 ? 0 : (k[2 * j + 3] - k[2 * j + 1]) / hh;
  };
  const tan = (j) => {
    if (j === 0) return sec(0);
    if (j === n - 1) return sec(n - 2);
    const p = sec(j - 1), q = sec(j);
    if (p * q <= 0) return 0;
    const hp = k[2 * j] - k[2 * j - 2], hn = k[2 * j + 2] - k[2 * j];
    const w1 = 2 * hn + hp, w2 = hn + 2 * hp;
    return (w1 + w2) / (w1 / p + w2 / q);
  };
  const m0 = tan(i), m1 = tan(i + 1);
  const t = (x - x0) / h, t2 = t * t, t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * h * m0
       + (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * h * m1;
}

function evalCurve(curve, x, exponent) {
  const c = Math.min(1, Math.max(0, x));
  if (curve.mode === "POWER") return Math.pow(c, Math.max(exponent, 1e-6));
  return Math.min(1, Math.max(0, pchip(curve.knots, c)));
}

const SVG_NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs) => {
  const n = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};

/**
 * A Blender-style curve widget. `which` is "translation" or "rotation"; it drives the NT topic
 * names and which deadband/exponent fields the overlay reads.
 */
class CurveEditor {
  constructor(which, title) {
    this.which = which;
    this.modeTopic  = `${SET_CURVES}${which}Mode`;
    this.knotsTopic = `${SET_CURVES}${which}Knots`;
    this.curve = { mode: "POWER", knots: DEFAULT_KNOTS.slice() };
    this.drag = -1;

    this.root = document.createElement("div");
    this.root.className = "curve";
    this.root.innerHTML =
      `<div class="head"><span class="title">${title}</span><span class="spacer"></span>` +
      `<button class="preset" data-p="linear">Linear</button>` +
      `<button class="preset" data-p="squared">Squared</button>` +
      `<button class="preset" data-p="custom">Custom</button></div>`;

    this.svg = el("svg", { class: "plot", viewBox: "0 0 100 100" });
    this.root.appendChild(this.svg);
    const tip = document.createElement("div");
    tip.className = "tip";
    tip.textContent = "Drag knots · click the plot to add · double-click a knot to remove";
    this.root.appendChild(tip);

    this.root.querySelectorAll(".preset").forEach((b) =>
      b.addEventListener("click", () => this.preset(b.dataset.p)));
    this.svg.addEventListener("pointerdown", (e) => this.onDown(e));
    this.svg.addEventListener("pointermove", (e) => this.onMove(e));
    this.svg.addEventListener("pointerup", (e) => this.onUp(e));
    this.svg.addEventListener("pointercancel", (e) => this.onUp(e));
    this.draw();
  }

  exponentKey() {
    return this.which === "translation" ? "translationExponent" : "rotationExponent";
  }

  exponent() {
    const f = fields.get(this.exponentKey());
    return f ? f.value : 1.0;
  }

  deadband() {
    const f = fields.get(this.which === "translation"
      ? "translationDeadband" : "rotationDeadband");
    return f ? f.value : 0;
  }

  // Convert an event to plot coordinates in [0,1], y up.
  toPlot(e) {
    const r = this.svg.getBoundingClientRect();
    return [
      Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
      Math.min(1, Math.max(0, 1 - (e.clientY - r.top) / r.height)),
    ];
  }

  hitKnot(px, py) {
    const k = this.curve.knots;
    for (let i = 0; i < k.length / 2; i++) {
      if (Math.hypot(k[2 * i] - px, k[2 * i + 1] - py) < 0.055) return i;
    }
    return -1;
  }

  onDown(e) {
    const [px, py] = this.toPlot(e);
    const hit = this.hitKnot(px, py);
    if (hit > 0 && hit < this.curve.knots.length / 2 - 1) {
      this.drag = hit;
      this.svg.setPointerCapture(e.pointerId);
      this.draw();
      return;
    }
    if (hit !== -1) return;                       // an endpoint: pinned, ignore
    this.addKnot(px, py);                         // empty space: add a knot
  }

  onMove(e) {
    if (this.drag < 0) return;
    const [px, py] = this.toPlot(e);
    const k = this.curve.knots;
    const lo = k[2 * this.drag - 2] + 0.02;
    const hi = k[2 * this.drag + 2] - 0.02;
    k[2 * this.drag] = Math.min(hi, Math.max(lo, px));
    k[2 * this.drag + 1] = py;
    this.draw();
  }

  onUp(e) {
    if (this.drag < 0) return;
    this.drag = -1;
    try { this.svg.releasePointerCapture(e.pointerId); } catch (_) { /* already released */ }
    this.commit();
  }

  // Sample the current shape so switching POWER -> CUSTOM does not change the feel.
  seedFromCurrent() {
    const exp = this.exponent();
    const xs = [0, 0.25, 0.5, 0.75, 1];
    const knots = [];
    for (const x of xs) knots.push(x, evalCurve(this.curve, x, exp));
    return sanitizeKnots(knots);
  }

  addKnot(px, py) {
    if (this.curve.mode !== "CUSTOM") {
      this.curve = { mode: "CUSTOM", knots: this.seedFromCurrent() };
    }
    if (this.curve.knots.length / 2 >= MAX_KNOTS) {
      setStatus(`At most ${MAX_KNOTS} knots.`);
      return;
    }
    this.curve.knots = sanitizeKnots(this.curve.knots.concat([px, py]));
    this.commit();
  }

  removeKnot(i) {
    const k = this.curve.knots;
    if (i <= 0 || i >= k.length / 2 - 1) return;
    this.curve.knots = sanitizeKnots(k.slice(0, 2 * i).concat(k.slice(2 * i + 2)));
    this.commit();
  }

  preset(kind) {
    if (kind === "custom") {
      this.curve = { mode: "CUSTOM", knots: this.seedFromCurrent() };
    } else {
      this.curve = { mode: "POWER", knots: this.curve.knots.slice() };
      writeValue(this.exponentKey(), kind === "squared" ? 2.0 : 1.0);
    }
    this.commit();
  }

  commit() {
    client.publishTopic(this.modeTopic, "string");
    client.publishTopic(this.knotsTopic, "double[]");
    client.addSample(this.modeTopic, this.curve.mode);
    client.addSample(this.knotsTopic, this.curve.knots);
    this.draw();
  }

  // Accept a curve pushed by the robot, unless the operator is mid-drag.
  receive(mode, knots) {
    if (this.drag >= 0) return;
    if (mode !== undefined) this.curve.mode = mode;
    if (knots !== undefined) this.curve.knots = sanitizeKnots(Array.from(knots));
    this.draw();
  }

  draw() {
    const svg = this.svg;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.appendChild(el("rect", { class: "frame", x: 0, y: 0, width: 100, height: 100 }));
    for (let g = 1; g < 4; g++) {
      svg.appendChild(el("line", { class: "grid", x1: g * 25, y1: 0, x2: g * 25, y2: 100 }));
      svg.appendChild(el("line", { class: "grid", x1: 0, y1: g * 25, x2: 100, y2: g * 25 }));
    }
    svg.appendChild(el("line", { class: "ref", x1: 0, y1: 100, x2: 100, y2: 0 }));

    // The deadband is applied before the curve, so shade it as unreachable travel.
    const dead = this.deadband();
    if (dead > 0) {
      svg.appendChild(el("rect",
        { class: "dead", x: 0, y: 0, width: dead * 100, height: 100 }));
    }

    const exp = this.exponent();
    let d = "";
    for (let i = 0; i <= 100; i++) {
      const x = i / 100;
      const y = evalCurve(this.curve, x, exp);
      d += `${i === 0 ? "M" : "L"}${(x * 100).toFixed(2)},${((1 - y) * 100).toFixed(2)}`;
    }
    svg.appendChild(el("path", { class: "line", d }));

    if (this.curve.mode === "CUSTOM") {
      const k = this.curve.knots;
      for (let i = 0; i < k.length / 2; i++) {
        const pinned = i === 0 || i === k.length / 2 - 1;
        const c = el("circle", {
          class: "knot" + (pinned ? " pinned" : "") + (this.drag === i ? " drag" : ""),
          cx: k[2 * i] * 100, cy: (1 - k[2 * i + 1]) * 100, r: 3.2,
        });
        if (!pinned) {
          c.addEventListener("dblclick", (e) => { e.stopPropagation(); this.removeKnot(i); });
        }
        svg.appendChild(c);
      }
    }

    this.root.querySelectorAll(".preset").forEach((b) => {
      const isCustom = this.curve.mode === "CUSTOM";
      const on = b.dataset.p === "custom" ? isCustom
        : !isCustom && Math.abs(exp - (b.dataset.p === "squared" ? 2 : 1)) < 0.05;
      b.classList.toggle("active", on);
    });
  }
}

/**
 * Picker for the driver binding scheme. The options come from the robot (name|label|summary),
 * so adding a ControlScheme needs no change here.
 */
const schemePicker = {
  root: Object.assign(document.createElement("div"), { className: "scheme" }),
  options: [],
  active: "",
  render() {
    this.root.innerHTML = "";
    for (const { name, label, summary } of this.options) {
      const b = document.createElement("button");
      b.className = "opt" + (name === this.active ? " active" : "");
      b.innerHTML = `${label}<span class="sum">${summary}</span>`;
      b.addEventListener("click", () => {
        client.publishTopic(SET_SCHEME, "string");
        client.addSample(SET_SCHEME, name);
      });
      this.root.appendChild(b);
    }
  },
  setOptions(list) {
    this.options = list.map((entry) => {
      const [name, label, summary] = String(entry).split("|");
      return { name, label: label || name, summary: summary || "" };
    });
    this.render();
  },
  setActive(name) { this.active = name; this.render(); },
};

const editors = {
  translation: new CurveEditor("translation", "Translation response"),
  rotation: new CurveEditor("rotation", "Rotation response"),
};

const client = new NT4_Client(
  window.location.hostname,
  "controls-tuner",
  () => {},
  () => {},
  (topic, _ts, value) => {
    const name = topic.name;
    if (name.startsWith(META)) {
      const rest = name.slice(META.length);          // "<key>/<min|max|default>"
      const slash = rest.lastIndexOf("/");
      if (slash < 0) return;
      const f = ensureField(rest.slice(0, slash));
      const which = rest.slice(slash + 1);
      if (which === "min") f.min = value;
      else if (which === "max") f.max = value;
      else if (which === "default") f.def = value;
      else if (which === "canDisable") f.canDisable = value;
      if (META_KEYS.includes(which)) f.meta.add(which);
      build();
    } else if (name.startsWith(VALUES)) {
      const key = name.slice(VALUES.length);
      const f = ensureField(key);
      if (f.dragging) return;                        // don't fight an in-progress drag
      f.value = value;
      if (f.slider) f.slider.value = value;
      render(key);
      build();
    } else if (name.startsWith(ENABLED)) {
      const key = name.slice(ENABLED.length);
      const f = ensureField(key);
      f.enabled = value;
      render(key);
      build();
    } else if (name === CURVES + "translationMode") {
      editors.translation.receive(value, undefined);
    } else if (name === CURVES + "translationKnots") {
      editors.translation.receive(undefined, value);
    } else if (name === CURVES + "rotationMode") {
      editors.rotation.receive(value, undefined);
    } else if (name === CURVES + "rotationKnots") {
      editors.rotation.receive(undefined, value);
    } else if (name === "/Controls/schemes") {
      schemePicker.setOptions(Array.from(value));
    } else if (name === "/Controls/scheme") {
      schemePicker.setActive(value);
    } else if (name === "/Controls/profiles") {
      profiles = Array.from(value); renderProfiles();
    } else if (name === "/Controls/activeProfile") {
      active = value; renderProfiles();
    } else if (name === "/Controls/status/dirty") {
      dirty = value; renderProfiles();
    } else if (name === "/Controls/status/message") {
      setStatus(value);
    } else if (name === "/Controls/status/path") {
      $("path").textContent = value;
    }
  },
  () => {
    $("conn").classList.add("on");
    setStatus("Connected.");
    for (const [key, f] of fields) {
      client.publishTopic(SET_VALS + key, "double");
      if (f.canDisable) client.publishTopic(SET_EN + key, "boolean");
    }
    for (const ed of Object.values(editors)) {
      client.publishTopic(ed.modeTopic, "string");
      client.publishTopic(ed.knotsTopic, "double[]");
    }
    client.publishTopic("/Controls/activeProfile", "string");
    client.publishTopic("/Controls/command/save", "boolean");
    client.publishTopic("/Controls/command/reload", "boolean");
    client.publishTopic("/Controls/command/create", "string");
    client.publishTopic("/Controls/command/delete", "string");
  },
  () => { $("conn").classList.remove("on"); setStatus("Disconnected — retrying…"); }
);

client.subscribe(["/Controls/"], true, false, 0.05);
client.connect();

$("save").addEventListener("click", () => {
  client.publishTopic("/Controls/command/save", "boolean");
  client.addSample("/Controls/command/save", true);
  setStatus("Saving…");
});
$("revert").addEventListener("click", () => {
  client.publishTopic("/Controls/command/reload", "boolean");
  client.addSample("/Controls/command/reload", true);
  setStatus("Reloading from disk…");
});
$("create").addEventListener("click", () => {
  const name = prompt("Name for the new profile (copies the current values):");
  if (!name) return;
  client.publishTopic("/Controls/command/create", "string");
  client.addSample("/Controls/command/create", name.trim());
});
$("delete").addEventListener("click", () => {
  if (!active || !confirm(`Delete profile "${active}"?`)) return;
  client.publishTopic("/Controls/command/delete", "string");
  client.addSample("/Controls/command/delete", active);
});
$("profile").addEventListener("change", (e) => {
  client.publishTopic("/Controls/activeProfile", "string");
  client.addSample("/Controls/activeProfile", e.target.value);
});
</script>
</body>
</html>
